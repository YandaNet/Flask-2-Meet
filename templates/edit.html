{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Редагувати нотатку</h2>
        <form method="POST" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Заголовок</label>
                <input type="text" name="title" value="{{ note['title'] }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Зміст</label>
                <textarea name="content" class="form-control" rows="4" required>{{ note['content'] }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Оновити</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
